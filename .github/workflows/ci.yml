name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Check and test
    # diMail is a macOS app: the core uses the Keychain. macOS runners are free for public repositories.
    if: ${{ !github.event.repository.private }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Types and frontend build
        run: npm run build
      - name: Tests
        run: cargo test --workspace
      - name: Nothing private in the tree
        run: scripts/check-public.sh .
